name: Update profile cards

on:
  schedule:
    # Every Monday at 05:23 UTC, off the top of the hour to avoid the scheduler's peak load
    - cron: '23 5 * * 1'

  # Redraw when the card options below change, on whichever branch they change
  push:
    paths:
      - .github/workflows/update-profile-cards.yml

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  cards:
    name: Render and commit the cards

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write # to push the refreshed cards

    env:
      # Shared by both cards, which differ only in the theme.
      # Reference: https://stats-forge.github.io/github-stats-forge/docs/cards/stats/
      CARD_OPTIONS: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render the stats card (light)
        uses: stats-forge/github-stats-forge-action@34d1a9e89a6811d2c6063b576e08fe4e54f0f4d1 # v0.14.0
        with:
          card: stats
          path: profile/stats-light.svg
          options: '?${{ env.CARD_OPTIONS }}&theme=github_light'
          # An optional STATS_PAT repository secret takes over from the workflow token
          token: ${{ secrets.STATS_PAT || github.token }}

      - name: Render the stats card (dark)
        uses: stats-forge/github-stats-forge-action@34d1a9e89a6811d2c6063b576e08fe4e54f0f4d1 # v0.14.0
        with:
          card: stats
          path: profile/stats-dark.svg
          options: '?${{ env.CARD_OPTIONS }}&theme=github_dark'
          token: ${{ secrets.STATS_PAT || github.token }}

      - name: Commit if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile
          git diff --quiet --cached || git commit -m 'chore: refresh profile cards'
          git push
